<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en-US' }}">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- jekyll-seo-tag handles og:, twitter:, description, etc. -->
		{% seo %}
		<title>{{ page.title }} - {{ site.title }}</title>
		<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
		<!-- RSS feed link (jekyll-feed) -->
		{% feed_meta %}
	</head>
	<!-- body -->
	<body>
		<!-- Include the header, header includ the nav -->
		{% include header.html %}
		<!-- Include content for all -->
		<main>
			{{ content }}
		</main>
		<!-- Include the footer -->
		{% include footer.html %}
	</body>
</html>
