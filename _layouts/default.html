<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- jekyll-seo-tag handles og:, twitter:, description, etc. -->
    {% seo %}

    <title>
      {%
        {{ page.title }} | {{ site.title }}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>

    <!-- Minima base stylesheet -->
    <link rel="stylesheet"
          href="{{ '/assets/css/main.css' | relative_url }}">

    <!-- RSS feed link (jekyll-feed) -->
    {% feed_meta %}

  </head>

  <body>

    <!-- ===================== MAIN CONTENT ==================== -->
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>


  </body>

</html>
