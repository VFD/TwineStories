# =============================================================
# Jekyll Manual Build & Deploy
# Repository : VFD/TwineStories
# Site URL   : https://vfd.github.io/TwineStories/
#
# Trigger    : Manual only (workflow_dispatch)
#              Go to Actions tab → "Jekyll Build & Deploy" → Run workflow
# =============================================================

name: Jekyll Build & Deploy

on:
  workflow_dispatch:    # Manual trigger only — no automatic build on push
    inputs:
      reason:
        description: "Reason for manual deploy (optional)"
        required: false
        default: "Manual deploy"

# Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages:    write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # Job 1 : Build the Jekyll site
  # -----------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true   # Caches gems for faster subsequent runs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  # -----------------------------------------------------------
  # Job 2 : Deploy to GitHub Pages (runs only if build succeeds)
  # -----------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build           # Waits for build job to complete successfully

    environment:
      name: github-pages
      url: https://vfd.github.io/TwineStories/

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# =====[EOF]=================================================
